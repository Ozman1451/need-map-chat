[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "needmap-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "scikit-learn",
  "umap-learn",
  "numpy",
  "pandas",
  "pyarrow",
  "google-genai",
  "pydantic>=2",
  "pydantic-settings",
  "tenacity",
  "apify-client",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
